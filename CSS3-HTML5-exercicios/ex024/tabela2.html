<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas 2</title>
    <link rel="stylesheet" href="tabela2.css">
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--Anatomia para tabelas grandes
        TABLE  | O QUE PODE USAR DENTRO DELES
            THEAD   
                    TR, TD, TH    
            TBODY
                    TR, TD, TH
            TFOOT
                    TR, TD, TH   
    -->
    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>São paulo</td>
                <td>46 081 801</td>
            </tr>
            
            <tr>
                <td>Minhas Gerais</td>
                <td>21 393 441</td>
            </tr>

            <tr>
                <td>Rio de Janeiro</td>
                <td>17 223 54</td>
            </tr>

        </tbody>
        
        <tfoot>
            <tr>
                <th>Total de Habitantes</th>
                <td>400000</td>
            </tr>
        </tfoot>
    </table>


</body>
</html>
