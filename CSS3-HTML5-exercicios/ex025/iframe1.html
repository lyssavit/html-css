<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>



    <style>
        iframe{
            width: 500px ; 
            height: 500px;
            overflow: hidden;
        }



    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0" >
            <a href="https://wwww.cursoemvideo.com">CursoEmVideo</a>
        </iframe>
        
        para aprender a programar.</p>
    
        <!--<p>
            O site do <iframe src="https://www.google.com/?hl=pt_BR" frameborder="0"></iframe> também é muito legal! Pena que não funciona dentro do iframe
        </p> -->

        
        <p>O repositório do Guanabara
            
            <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" >
                <a href="https://wwww.cursoemvideo.com">CursoEmVideo</a>
            </iframe>
            também é bem legal</p>
    </body>
</html>
